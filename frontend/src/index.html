<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>بُناة | منصة ربط التدريب بالأثر</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="بُناة منصة داخلية تربط التدريب بالدروس والتقدم ومؤشرات الأداء لإبراز أثر التعلّم على الموظف والمدير والإدارة."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        background:
          radial-gradient(circle at top right, rgba(15, 76, 129, 0.14), transparent 28%),
          radial-gradient(circle at left 20%, rgba(20, 87, 58, 0.12), transparent 30%),
          linear-gradient(145deg, #fbfcff 0%, #eff4f8 48%, #f7fbf7 100%);
      }

      .app-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .app-loading__card {
        width: min(100%, 24rem);
        padding: 1.75rem;
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(20, 87, 58, 0.1);
        box-shadow: 0 24px 60px rgba(24, 39, 75, 0.08);
        display: grid;
        justify-items: center;
        gap: 1rem;
        text-align: center;
      }

      .app-loading__logo {
        width: 5rem;
        height: auto;
      }

      .app-loading__title {
        margin: 0;
        color: #102432;
        font-size: 1.15rem;
        font-weight: 700;
      }

      .app-loading__text {
        margin: 0;
        color: #526172;
        line-height: 1.8;
      }

      .app-loading__bar {
        width: 100%;
        height: 0.4rem;
        border-radius: 999px;
        background: rgba(15, 76, 129, 0.1);
        overflow: hidden;
      }

      .app-loading__bar::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(135deg, #14573a, #0f4c81);
        animation: app-loading-slide 1.1s ease-in-out infinite alternate;
      }

      @keyframes app-loading-slide {
        from {
          transform: translateX(-25%);
        }

        to {
          transform: translateX(185%);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-loading">
        <div class="app-loading__card">
          <img class="app-loading__logo" src="assets/bunat-small-logo.svg" alt="شعار بُناة" />
          <p class="app-loading__title">بُناة</p>
          <p class="app-loading__text">جارٍ تحميل المنصة وربط رحلة التعلم بالأثر القابل للقياس.</p>
          <div class="app-loading__bar" aria-hidden="true"></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
